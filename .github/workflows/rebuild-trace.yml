name: Rebuild Trace

# A merged pull request that names a prediction joins its row in the trace.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  rebuild-trace:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rebuild the trace
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/trace.js')({ github, context });

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evidence-packet/trace_matrix.csv
          git diff --cached --quiet || (git commit -m "evidence: rebuild the trace" && git push)
