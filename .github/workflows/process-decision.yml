name: Process Decision

on:
  issues:
    types: [opened]

jobs:
  process-decision:
    if: contains(github.event.issue.labels.*.name, 'decision')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue and append to CSV
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const body = issue.body;

            // Parse form fields from issue body
            const parseField = (label) => {
              const regex = new RegExp(`### ${label}\\s*\\n\\n([\\s\\S]*?)(?=\\n\\n###|$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            };

            const { readLog, writeLog, nextId, closePrediction } = require('./.github/scripts/evidence.js');
            const csvPath = 'evidence-packet/decision_log.csv';
            const prePath = 'evidence-packet/pre_registrations.csv';

            if (!fs.existsSync(csvPath)) {
              core.setFailed(
                `📁 Can't find ${csvPath}\n\n` +
                `Quick fix: create it with its header row (see evidence-packet/README.md), then re-open this issue.`
              );
              return;
            }

            const log = readLog(fs.readFileSync(csvPath, 'utf8'));
            const decisionId = nextId(log.rows.map((r) => r.decision_id), 'DEC');
            const preRef = (parseField('Related Hypothesis \\(PRE-XXX\\)').match(/PRE-\d+/) || [''])[0];
            const outcome = parseField('How did the prediction end\\?');
            const date = new Date().toISOString().split('T')[0];
            const oneLine = (v) => v.replace(/\n/g, ' ');

            log.rows.push({
              decision_id: decisionId,
              date,
              decision: parseField('Decision'),
              pre_reference: preRef,
              outcome: outcome === 'No prediction to close' ? '' : outcome,
              context: oneLine(parseField('Context')),
              evidence: oneLine(parseField('Evidence')),
              surprised: parseField('Were you surprised\\?'),
              learning: oneLine(parseField('What did you learn\\?')),
              next_steps: oneLine(parseField('Next Steps')),
            });
            fs.writeFileSync(csvPath, writeLog(log));

            // The decision closes the prediction it names, when it says how it ended.
            let closed = false;
            if (preRef && fs.existsSync(prePath)) {
              const pre = readLog(fs.readFileSync(prePath, 'utf8'));
              closed = closePrediction(pre, preRef, outcome, new Date().toISOString(), decisionId);
              if (closed) fs.writeFileSync(prePath, writeLog(pre));
            }

            await require('./.github/scripts/trace.js')({ github, context });
            console.log(`Logged ${decisionId}${closed ? `, closing ${preRef}` : ''}`);

            core.exportVariable('DEC_ID', decisionId);
            core.exportVariable('DATE', date);
            core.exportVariable('CLOSED', closed ? `${preRef} is now closed: ${outcome.toLowerCase()}.` : '');

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evidence-packet
          git commit -m "evidence: $DEC_ID ($DATE)"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = process.env.DATE;
            const id = process.env.DEC_ID;
            const closed = process.env.CLOSED;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ${id} logged`,
                ``,
                `Your decision is now part of the evidence packet.${closed ? ' ' + closed : ''}`,
                ``,
                `**Why this matters:**`,
                `Six months from now, when someone asks "why did we do it that way?",`,
                `this record will tell the story — complete with the context and evidence`,
                `that made this the right call at the time.`,
                ``,
                `> 📝 Decisions aren't just outcomes; they're learning artifacts.`,
                ``,
                `— Recorded ${date} in \`evidence-packet/decision_log.csv\`; the trace is rebuilt in \`evidence-packet/trace_matrix.csv\``
              ].join('\n')
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
